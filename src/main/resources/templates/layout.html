<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:text="${title}"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
              }
            }
          }
        }
    </script>
</head>
<body>
    <nav th:fragment="navbar" class="bg-slate-800 text-gray-300 p-4 flex justify-between items-center border-b border-slate-700">
            <a th:href="@{/consulta-cep}" class="hover:text-white transition-colors">Consultar CEP</a>
            <a th:href="@{/consulta-cnpj}" class="hover:text-white transition-colors">Consultar CNPJ</a>
    </nav>
</body>
</html>
