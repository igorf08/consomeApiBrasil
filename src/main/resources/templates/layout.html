<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:text="${title}"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
              }
            }
          }
        }
    </script>
</head>
<body>
    <nav th:fragment="navbar" class="bg-slate-800 text-gray-300 p-4 flex justify-between items-center border-b border-slate-700">
        <div class="flex items-center gap-6 relative w-full max-w-7xl mx-auto">
            <a th:href="@{/}" class="text-white font-bold text-xl">API Brasil</a>
            
            <div class="relative group">
                <button id="dropdownBtn" class="hover:text-white transition-colors flex items-center gap-1">
                    Consultas
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <div id="dropdownMenu" class="hidden absolute top-full left-0 mt-2 w-48 bg-slate-700 rounded-md shadow-lg py-1 z-10 border border-slate-600">
                    <a th:href="@{/consulta-cep}" class="block px-4 py-2 text-sm hover:bg-slate-600 hover:text-white">Buscar CEP</a>
                    <a th:href="@{/consulta-cnpj}" class="block px-4 py-2 text-sm hover:bg-slate-600 hover:text-white">Buscar CNPJ</a>
                    <a href="#" class="block px-4 py-2 text-sm hover:bg-slate-600 hover:text-white text-gray-400">Em breve...</a>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const btn = document.getElementById('dropdownBtn');
                const menu = document.getElementById('dropdownMenu');
                
                if(btn && menu) {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        menu.classList.toggle('hidden');
                    });
                    
                    // Fecha o menu caso clique em outro lugar da tela
                    document.addEventListener('click', (e) => {
                        if (!btn.contains(e.target) && !menu.contains(e.target)) {
                            menu.classList.add('hidden');
                        }
                    });
                }
            });
        </script>
    </nav>
</body>
</html>
